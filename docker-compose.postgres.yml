services:
  archive:
    image: postgres:17
    environment:
      POSTGRES_DB: polyalpha
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the optional archive}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  postgres-data:
