# ============================================================
# PolyAlpha v0.3.0 RESEARCH BASELINE — FROZEN
# ============================================================
# This file is immutable for the 60-90 day real-data collection
# window. Changes to anything affecting decisions require a new
# baseline. See EMPIRICAL_ALPHA_REPORT.md §1-6 for rationale.
#
# hash: computed by scripts/freeze_baseline.py — do not edit by hand
# ============================================================

research_version: "v0.3.0-research-baseline"

market_filter:
  min_liquidity: "5000"
  min_volume: "25000"
  max_spread: "0.05"

signal:
  min_net_edge: "0.025"
  uncertainty_multiplier: "1.0"

risk:
  position_fraction: "0.005"
  max_market_fraction: "0.02"
  max_event_fraction: "0.05"
  max_cluster_fraction: "0.05"
  max_category_fraction: "0.10"
  max_total_exposure_fraction: "0.20"
  max_drawdown: "0.08"

execution:
  max_book_levels: 10
  latency_assumption_ms: 1000
  slippage_buffer: "0.002"

models:
  baseline_version: "v0.3.0"

experiment:
  random_seed: 4262026

# ============================================================
# Universe separation (collection vs research vs signal vs executable).
# The COLLECTION universe is deliberately broad: every reasonable active
# order-book market is captured raw, so we can later ask "what happened to
# the markets my filter rejected?". Research/signal/executable filters are
# applied downstream, never at ingestion.
# ============================================================
universes:
  collection:
    active_only: true
    include_markets_without_volume: true
    max_pages: 1000
    page_size: 100
    reconcile_interval_seconds: 30
    reconcile_max_tokens_per_pass: 25
    raw_root: "data/raw"
    manifest_root: "data/manifests"
  research:
    min_liquidity: "5000"
    min_volume: "25000"
    max_spread: "0.05"
  signal:
    min_net_edge: "0.025"
  executable:
    min_net_edge: "0.025"
    max_spread: "0.05"

collection:
  database: "data/research.sqlite3"
  page_size: 100
  max_pages: 1
  timeout_seconds: 20
  attempts: 3
  interval_seconds: 30
  ws_heartbeat_seconds: 10

