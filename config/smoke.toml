[collection]
database = "data/smoke.sqlite3"
page_size = 2
max_pages = 1
timeout_seconds = 10
attempts = 1
interval_seconds = 1

[market_filter]
min_liquidity = "5000"
min_volume = "25000"
max_spread = "0.05"
max_age_seconds = 30
min_depth_shares = "100"

[signal]
min_net_edge = "0.025"

[execution]
latency_seconds = 1
exit_policy = "hold"

[model]
uncertainty = "0.05"

[risk]
initial_cash = "10000"
