version: '3.8'

services:
  # PostgreSQL for persistent storage
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: polyalpha
      POSTGRES_USER: polyalpha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polyalpha_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyalpha"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for live state (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://polyalpha:${POSTGRES_PASSWORD:-polyalpha_dev}@postgres:5432/polyalpha
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    command: python -m polyalpha.cli --config /app/config/base.toml

  # Paper trading service
  paper:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://polyalpha:${POSTGRES_PASSWORD:-polyalpha_dev}@postgres:5432/polyalpha
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    command: python scripts/run_paper.py --config /app/config/paper.yaml --database /app/data/paper.sqlite

  # Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - app
    environment:
      DATABASE_URL: postgresql://polyalpha:${POSTGRES_PASSWORD:-polyalpha_dev}@postgres:5432/polyalpha
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    command: streamlit run src/polyalpha/dashboard/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_data:
